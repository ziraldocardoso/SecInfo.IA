name: Deploy SecInfo.IA (SecInfo Hosting for AI explotation)

on:
  push:
    branches:
      - main # Dispara o deploy ao atualizar a branch principal

jobs:
  build-and-deploy:
    name: Build and Deploy to OCI
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout do código
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📦 Instalar dependências
        run: bun install --frozen-lockfile

      - name: 🛠️ Build do projeto (Vite)
        # O Vite gera os arquivos otimizados na pasta padrão 'dist/'
        run: bun run build

      - name: 🔐 Configurar Autenticação SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}

      - name: 🚀 Deploy via Rsync para OCI
        run: |
          # Cria o diretório .ssh e adiciona o IP da OCI aos hosts conhecidos para evitar prompts de confirmação
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts
          
          # Sincroniza a pasta dist/ e apaga arquivos velhos (mas ignora o ws-server.js para não ser deletado)
          rsync -avz --delete --exclude 'ws-server.js' ./dist/ ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:${{ secrets.OCI_TARGET_DIR }}
          
          # Copia o nosso servidor WebSocket para a mesma pasta no servidor
          scp ./ws-server.js ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:${{ secrets.OCI_TARGET_DIR }}/ws-server.js
          
          # Reinicia o serviço do sistema para rodar o código mais novo do WebSocket
          ssh ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }} "sudo systemctl restart secinfo-ws"
